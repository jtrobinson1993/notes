[package]
name = "akd-sidecar"
version = "0.1.0"
edition = "2021"
description = "v8 key-transparency sidecar — Meta's akd (AKD/CONIKS) directory behind a localhost API the Node relay calls"
license = "AGPL-3.0-only"

[dependencies]
akd = { version = "0.12", features = ["whatsapp_v1", "serde_serialization"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
