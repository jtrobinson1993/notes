[package]
name = "akd-sidecar"
version = "0.1.0"
edition = "2021"
description = "v8 key-transparency sidecar — Meta's akd (AKD/CONIKS) directory behind a localhost API the Node relay calls"
license = "AGPL-3.0-only"

[dependencies]
akd = { version = "0.12", features = ["whatsapp_v1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
