[package]
name = "app"
version = "0.1.0"
description = "Accord — E2EE notes + chat, local-first"
authors = ["Jarrod Robinson"]
license = "AGPL-3.0-only"
repository = "https://github.com/jtrobinson1993/notes"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.9"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
data-encoding = "2"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
