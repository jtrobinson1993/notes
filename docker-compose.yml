# Production compose for a self-hosted Accord relay (spec/relay.md).
#
# The `notes` service is the v8 relay — an API-only, zero-knowledge message
# relay. It serves no web app: clients are the native desktop app, which points
# at APP_ORIGIN. Operator tasks (invites, devices) are the relay CLI:
#   docker compose exec notes node server/dist/relay-cli.js status
#
# Caddy terminates HTTPS (automatic Let's Encrypt) and reverse-proxies to the
# relay; nothing but Caddy is exposed to the internet. Everything is configured
# through .env — copy .env.example to .env and set APP_ORIGIN, then:
#
#   docker compose up -d            # pulls the published image (no build on prod)
#   docker compose pull && up -d    # release: grab the newest image and restart
#
# To run a locally-built image instead of the published one (dev/hacking):
#   docker compose up -d --build
services:
  notes:
    image: ghcr.io/jtrobinson1993/notes:${NOTES_TAG:-latest}
    build: .
    container_name: notes
    restart: unless-stopped
    # No plaintext host port — Caddy fronts the relay over HTTPS. 3000 stays on
    # the internal compose network only.
    expose:
      - '3000'
    ports:
      # v6 voice: mediasoup RTC media (UDP, TCP fallback). Forward this range on
      # your router too; keep it in sync with VOICE_RTC_MIN/MAX_PORT.
      - '40000-40100:40000-40100/udp'
      - '40000-40100:40000-40100/tcp'
    # Loads KLIPY_API_KEY, VAPID_*, and any other secrets/config into the
    # container. Required because the published image carries no .env.
    env_file:
      - .env
    environment:
      # The public origin clients reach this relay at (also drives HSTS/CSP).
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # Who may create an account: 'invite' (default, closed — the operator mints
      # invites with the CLI) or 'public' (anyone may register).
      RELAY_REGISTRATION_MODE: ${RELAY_REGISTRATION_MODE:-invite}
      # Voice: the public/LAN IP clients reach this host at (required for calls
      # to connect off-localhost). Leave unset for local-only testing.
      VOICE_ANNOUNCED_IP: ${VOICE_ANNOUNCED_IP:-127.0.0.1}
      # Full-AKD key transparency (optional): point the relay at the sidecar on
      # the compose network. Unset AKD_SIDECAR_TOKEN → the relay uses the interim
      # Merkle KT and the sidecar service below can be removed.
      AKD_SIDECAR_URL: ${AKD_SIDECAR_TOKEN:+http://akd-sidecar:8091}
      AKD_SIDECAR_TOKEN: ${AKD_SIDECAR_TOKEN:-}
    volumes:
      - notes-data:/data
    depends_on:
      - akd-sidecar

  # v8 key-transparency (full-AKD, spec/key-transparency.md). Reachable only on
  # the compose network (no published port) and authenticated by
  # AKD_SIDECAR_TOKEN. Set that token in .env to enable full-AKD KT; leave it
  # empty to run interim-Merkle KT (this service then idles harmlessly).
  akd-sidecar:
    build: ./akd-sidecar
    image: ghcr.io/jtrobinson1993/notes-akd-sidecar:${NOTES_TAG:-latest}
    container_name: notes-akd-sidecar
    restart: unless-stopped
    expose:
      - '8091'
    environment:
      AKD_SIDECAR_HOST: 0.0.0.0
      AKD_SIDECAR_PORT: '8091'
      AKD_SIDECAR_TOKEN: ${AKD_SIDECAR_TOKEN:-}
    volumes:
      - akd-data:/akd-data

  caddy:
    image: caddy:2
    container_name: notes-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      # Caddy uses this as the site address it serves + auto-provisions a cert for.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - notes

volumes:
  notes-data:
  akd-data:
  caddy-data:
  caddy-config:
